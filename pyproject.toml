[project]
name = "lmscache"
version = "0.1.0"
description = "LMS Cache: a shared LM Studio model library on a NAS"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lmscache"]
include-package-data = true

[tool.setuptools.package-data]
lmscache = ["static/*"]
